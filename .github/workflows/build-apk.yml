name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # compileSdk 是 37，它只存在于 canary 渠道，所以不能交给
      # setup-android 的 packages 输入（那只会查稳定渠道）。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (incl. canary channel)
        run: |
          set -x
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # 先试稳定渠道，再试 canary
          sdkmanager "platform-tools" "build-tools;35.0.0" > /dev/null 2>&1 || true
          sdkmanager --channel=3 "platforms;android-37" "build-tools;35.0.0" || \
          sdkmanager --channel=3 "platforms;android-37" || true
          echo "--- 装了什么 ---"
          sdkmanager --list_installed || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build mainline debug APK
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace assembleMainlineDebug
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::assembleMainlineDebug failed, falling back to assembleDebug"
            ./gradlew --no-daemon --stacktrace assembleDebug
            rc=$?
          fi
          exit $rc

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          find . -name "*.apk" -type f -exec cp {} out/ \; 2>/dev/null || true
          ls -la out/ 2>/dev/null || echo "(no apk)"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gadgetbridge-miband11-apk
          path: out/*.apk
          if-no-files-found: warn
