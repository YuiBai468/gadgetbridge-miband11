name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它默认会去装 "tools" 包，
      # 而那个包已经从 SDK 仓库下架了，action 自己就报
      # "Failed to find package 'tools'" 挂掉。
      # ubuntu-latest 的 runner 本来就带 Android SDK，直接用。
      - name: Install SDK packages
        run: |
          set -x
          SDK="${ANDROID_HOME}"
          echo "ANDROID_HOME=$SDK"
          ls "$SDK" || true

          SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager = $SM"
          if [ -z "$SM" ]; then
            SM=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          fi

          yes | "$SM" --licenses > /dev/null 2>&1 || true

          # compileSdk 是 37，只在 canary 渠道
          "$SM" --channel=3 "platforms;android-37" || true
          "$SM" --channel=3 "build-tools;35.0.0"   || true
          "$SM" "platform-tools"                    || true

          echo "--- installed ---"
          "$SM" --list_installed || true
          echo "--- platforms dir ---"
          ls "$SDK/platforms" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build mainline debug APK
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace assembleMainlineDebug
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::assembleMainlineDebug failed, falling back to assembleDebug"
            ./gradlew --no-daemon --stacktrace assembleDebug
            rc=$?
          fi
          exit $rc

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          find . -name "*.apk" -type f -exec cp {} out/ \; 2>/dev/null || true
          ls -la out/ 2>/dev/null || echo "(no apk)"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gadgetbridge-miband11-apk
          path: out/*.apk
          if-no-files-found: warn
